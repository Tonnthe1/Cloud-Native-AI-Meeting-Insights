apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-insights-ingress
  namespace: meeting-insights
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    # Production deployments should configure TLS and redirect HTTP to HTTPS.
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: YOUR_ACM_CERTIFICATE_ARN
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meeting-insights-frontend
            port:
              number: 80
