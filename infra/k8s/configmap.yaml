apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-insights-config
  namespace: meeting-insights
data:
  POSTGRES_HOST: "REPLACE_WITH_RDS_ENDPOINT"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "meeting_insights"

  REDIS_HOST: "REPLACE_WITH_REDIS_ENDPOINT"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  MAX_QUEUE_SIZE: "100"
  MAX_JOB_ATTEMPTS: "3"
  JOB_TTL_SECONDS: "86400"

  STORAGE_BACKEND: "s3"
  S3_BUCKET: "REPLACE_WITH_S3_BUCKET"
  AWS_REGION: "REPLACE_WITH_AWS_REGION"
  S3_STARTUP_ATTEMPTS: "10"
  S3_STARTUP_DELAY_SECONDS: "2"

  AI_PROVIDER: "local"
  USE_WORKER_SERVICE: "true"
  ALLOW_SYNC_FALLBACK: "false"
  FW_MODEL: "small"
  FW_DEVICE: "cpu"
  FW_COMPUTE_TYPE: "int8"
  WORKER_HEALTH_PORT: "8001"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-insights-frontend-config
  namespace: meeting-insights
data:
  INTERNAL_API_URL: "http://meeting-insights-api"
