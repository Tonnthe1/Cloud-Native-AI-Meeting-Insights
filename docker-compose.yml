name: meeting-insights

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    logging: *default-logging

  backend-api:
    image: ${API_IMAGE:-meeting-insights-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      USE_WORKER_SERVICE: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,sys,urllib.request;
          d=json.load(urllib.request.urlopen('http://localhost:8000/health',timeout=3));
          sys.exit(0 if d.get('queue_available') and d.get('cache_available') and d.get('storage_available') else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  backend-worker:
    image: ${WORKER_IMAGE:-meeting-insights-worker:local}
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8001:8001"
    volumes:
      - whisper-cache:/home/app/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20m
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-meeting-insights-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      INTERNAL_API_URL: http://backend-api:8000
      API_KEY: ${API_KEY}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  ray-head:
    profiles: ["experimental"]
    image: rayproject/ray:2.8.0-py310
    command: ray start --head --dashboard-host=0.0.0.0 --dashboard-port=8265 --node-ip-address=0.0.0.0 --block
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8265:8265"
      - "${BIND_ADDRESS:-127.0.0.1}:10001:10001"
    volumes:
      - ./ray_serve:/ray_serve:ro
    environment:
      RAY_DISABLE_IMPORT_WARNING: "1"
    logging: *default-logging

  triton-server:
    profiles: ["experimental"]
    image: nvcr.io/nvidia/tritonserver:23.08-py3
    command: tritonserver --model-repository=/models --http-port=8000 --grpc-port=8001 --metrics-port=8002
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8003:8000"
      - "${BIND_ADDRESS:-127.0.0.1}:8004:8001"
      - "${BIND_ADDRESS:-127.0.0.1}:8005:8002"
    volumes:
      - ./triton_models:/models:ro
    environment:
      CUDA_VISIBLE_DEVICES: ""
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
  whisper-cache:
