name: Deploy to AWS EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to operate
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: Terraform and deployment action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: meeting-insights-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ENVIRONMENT: ${{ inputs.environment }}
  CLUSTER_NAME_OVERRIDE: meeting-insights-${{ inputs.environment }}
  IMAGE_TAG: ${{ github.sha }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  API_KEY: ${{ secrets.API_KEY }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Validate deployment entrypoint
        run: bash -n infra/deploy.sh

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: infra/deploy.sh plan

      - name: Apply infrastructure and deploy application
        if: inputs.action == 'apply'
        run: infra/deploy.sh all

      - name: Destroy application infrastructure
        if: inputs.action == 'destroy'
        env:
          CONFIRM_DESTROY: "yes"
        run: infra/deploy.sh destroy
