name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --quiet -r backend/requirements.txt flake8
      - name: Lint backend
        run: flake8 backend/app backend/tests --ignore=E501,W503 --show-source --statistics
      - name: Test backend
        working-directory: backend
        run: pytest -q
      - name: Build backend images
        run: |
          docker build -t meeting-insights-api ./backend
          docker build -f backend/Dockerfile.worker -t meeting-insights-worker ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
